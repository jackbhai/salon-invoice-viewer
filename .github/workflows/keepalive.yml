name: Keep Alive

# Prevents GitHub from disabling scheduled workflows in a public repo
# that has had no repository activity for 60 days. Pushes one tiny commit
# daily so the New Bill Notifier (and any other scheduler) runs forever.

on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Touch keepalive
        run: |
          echo "last-keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .keepalive
      - name: Commit and push
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "no change, nothing to commit"
            exit 0
          fi
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push origin ${GITHUB_REF#refs/heads/}
