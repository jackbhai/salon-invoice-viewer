name: New Bill Notifier

on:
  schedule:
    # fallback lane: every 5 minutes (GitHub free tier may delay/drop these)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # instant lane: external pinger (salon PC / cron-job.org) fires this every
  # 1-2 minutes so new-bill notifications don't wait for the schedule.
  repository_dispatch:
    types: [new-bill-check]

permissions:
  contents: write   # needed to commit the watcher state file back to the repo

concurrency:
  group: bill-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install deps
        run: pip install -r tools/requirements.txt

      # State lives in tools/.bill-state.json INSIDE the repo (committed below).
      # (The old actions/cache approach froze state forever: a fixed cache key
      #  is immutable, so last_seen never advanced and old bills re-notified.)
      - name: Watch for new bills
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          INVOICE_FILE: tools/.bill-state.json
        run: python tools/notify_bills.py | tee output.log

      - name: Commit watcher state
        if: always()
        run: |
          git config user.name "bill-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add tools/.bill-state.json
          if git diff --cached --quiet; then
            echo "state unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: advance bill-watcher state [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-log
          path: output.log
          if-no-files-found: ignore
